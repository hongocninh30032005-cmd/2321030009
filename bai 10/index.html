<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10 - JS</title>
    <style>
        main{
            display:flex;
        }
        .trai{
            width: 75%;
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .phai{
            width: 25%;
            border: 1px solid gray;
            border-radius: 20px;
            text-align: center;
        }
        .video{
            width: 90%;
            height: 550px;
            background-color: black;
            border-radius: 20px;
        }
        .bai-hat:hover{
            background-color: gray;
        }
        .bai-hat{
            width: 95%;
            height: 80px;
            background-color: antiquewhite;
            display:flex;
            align-items: center;
            margin: 10px auto;
        }
        img{
            width: 40%;
            margin-right: 10px;
            margin:auto;
        }
        p{
            width: 75%;
            
        }
    </style>
</head>
<body>
    <main>
        <div class="trai">
            <!-- <div class="video">

            </div> -->
            <iframe class="video" src="https://www.youtube.com/embed/vvmFvoyXPyE?si=-QnQr9-XCuXOr4WS" ></iframe>
        </div>
        <div class="phai">
            <h1>Danh sách</h1>
            <div class="danh-sach">
                <div onclick="chonBai(1)" class="bai-hat">
                    <img class="anh-bai" src="../ảnh/19.jpg" alt="">
                    <p>Là Ai Mang Nắng Đi Xa</p>

                </div>
                <div onclick="chonBai(2)" class="bai-hat">
                    <img class="anh-bai" src="../ảnh/19.jpg" alt="">
                    <p>Gửi - Reddy</p>

                </div>
                <div onclick="chonBai(3)" class="bai-hat">
                    <img class="anh-bai" src="../ảnh/20.jpg" alt="">
                    <p>Cho Con Tim Một Lý Do</p>

                </div>
                <div onclick="chonBai(4)" class="bai-hat">
                    <img class="anh-bai" src="../ảnh/21.jpg" alt="">
                    <p> Ngoặt </p>
                </div>
                <div onclick="chonBai(5)" class="bai-hat">
                    <img class="anh-bai" src="../ảnh/20.jpg" alt="">
                    <p>Vì Anh Đã Yêu</p>
                </div>

            </div>

        </div>

    </main>
    <script>
    var danhSachVid = [
            {
                id: 1,
                ten: "Là Ai Mang Nắng Đi Xa",
                duongDanAnh: " 20.jpg",
                duongDanYoutube: "https://www.youtube.com/embed/zHDECJy0p7k?si=2RuGygZ1vd9xcN1x",
            },

            {
                id: 2,
                ten: "Gửi - Reddy",
                duongDanAnh: "20.jpg",
                duongDanYoutube: "www.youtube.com/embed/rSn1-EXQL-A?si=Rkov9TqRlzOMSdMx" ,
            },

            {
                id: 3,
                ten: "Cho Con Tim Một Lý Do",
                duongDanAnh: "20.jpg",
                duongDanYoutube: "www.youtube.com/embed/TYO3Q5GxQKw?si=yOOKmNQ4YICzvXQY",
            },

            {
                id: 4,
                ten: "Ngoặt",
                duongDanAnh: "20.jpg",
                duongDanYoutube: "www.youtube.com/embed/mKOjYDmmAis?si=d7jtKQ-mICiDWwFB",
            },

            {
                id: 5,
                ten: "Vì Anh Đã Yêu",
                duongDanAnh: "20.jpg",
                duongDanYoutube: "https://www.youtube.com/embed/XzHNkmqw19Y?si=kt-GYH_rf0O5rWig",
                
            },
        ];

        function chonBai(id) {
            for (let i=0; i < danhSachVid.length; i++) {
                if(danhSachVid[i].id == id){
                    document.getElementsByClassName("video")[0].src =danhSachVid[i].duongDanYoutube
                }
            }
        }
        </script>
</body>
</html>
