<h1> Margin , padding , display</h1>

<!-- margin : tạo khoảng trống, căn chỉnh vvij trí ( width:chiều rộng , height: chiều cao)
 padding : tạo khoảng trống bên trong, căn chỉnh vị trí 
 display: xác định cách hiển thị phần tử -->
<style>
  .khoi-1{
    background-color:red;

 }
 .khoi-2 {
    background-color: green;
    /* margin truyền một giá trị thì sễ cách xung quanh = gia trị đó */
    /* 2 giá trị: giá trị đầu (trên dưới ), giá trị 2 (trái,phải)*/1
    /* 4 giá trị : Thứ tự trên phải dưới trái */
    margin:  10px 50px 100px 200px ;
 }
 .khoi-3 {
    background-color: yellow;
    padding: 10px 50px 100px 200px ; 
 }
