<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Bài 7 -JAVASCRIPT </title>
</head>
<body>
    <!-- Internal Javascript -->
     <script>
        //cÓ THỂ thêm mã nguồn html vào  trong JS
        //Lưu ý : html phải đặt  trong cặp  dấu " "
       document.writeln("HELLO <br> WORLD!");
       var tenSinhVien = " Ngoc Ninh";
       var tuoi = "21"
       document.writeln(tenSinhVien + "<br>" + tuoi + "<br>") ;
       var soThuNhat = 10;
       var soThuHai = 5; 
       //+ - * /
       // % chia lấy phần dư 
       var ketQua = soThuNhat % soThuHai;
       document.writeln("Kết quả là : " + ketQua) ;

       //++ --
       document.writeln(++soThuNhat);
       document.writeln(--soThuNhat);

       //+= -= *= /= %=
       //Tương đương: soThuNhat = soThuHai+ soThuHai
       soThuNhat+=soThuHai ;
       document.writeln(soThuNhat);
       // Kiểu dữ liệu 
       //String
       //Number Số
       // boolean (true/false)
       var a = "10";
       var b = "5.5" ;
       //Chuyển sting=> number dùng: parseInt() parssefloat( số nguyên sooss thực)
       var tong = parseInt(a) + parseFloat(b);
       document.writeln(tong);
    
       //String
       document.writeln("<br>");
       // Kiểm tra độ dài chuỗi length
       document.writeln(tenSinhVien.length);

       // Nối chuỗi +
       //var tenSinhVien = " Ngoc Ninh "
       //Kiểm tra tồn tại 
       // indenxOf tìm vị trí xuất hiện đầu tiên (có - vị trí/ k có -1)
       document.writeln("<br>");
       document.writeln(tenSinhVien.indexOf("a"));

       //includes kiểm tra xem từ có trong chuooic không ? Có = true / K= false
       document.writeln("<br>");
       document.writeln(tenSinhVien.includes("u"));

       //replace ( thay thế chuỗi )
       document.writeln("<br>");
       tenSinhVien.replace("Ngoc", "Ninh ");
       document.writeln(tenSinhVien);

       //Kiểm tra kí tự bắt đầu
       //startwith
       document.writeln("<br>");
       document.writeln(tenSinhVien.startsWith("Ngoc"));

       // Viết in hoa
       document.writeln("<br>");
       document.writeln(tenSinhVien.toUpperCase());

       // Viết in thường
       document.writeln("<br>");
       document.writeln(tenSinhVien.toLowerCase());

       //number
       //Kiểm tra dữ liệu có phải số không?
       // var a ="10";
       // var so = 20;
       // var kq = isNaN();\
       // document.writeln();

       // Date
       var homNay = new Date ();
       document.writeln("<br>") ;
       document.writeln(homNay); 
    
       var ngay = new Date (10/20/2026);
       document.writeln("<br>");
       document.writeln(ngay);
       
        // láy năm
        var nam = homNay.getFullYear() ;
       document.writeln("<br>");
       document.writeln(nam);

       //Lấy thang
       var thang = homNay.getMonth() + 1;
       document.writeln("<br>");
       document.writeln(thang);
       
       //Lấy ngay
       var ngay = homNay.getDate();
       document.writeln("<br>");
       document.writeln(ngay);

       //Lấy thu
       var thu = homNay.getDay() +1 ;
       document.writeln("<br>");
       document.writeln(thu);

       
       var namSinhNinh = nam - tuoi ;
       document.writeln("<br>");
       document.writeln("Ninh sinh năm" + namSinhNinh);

       //Mảng (array)
       var mangSo = [1,2,3,4,5] ;
       var mangTen = [ " Ninh , Linh , Nhung "] ;
       var thongTin = ["Ninh , 21 , false"] ;

       document.writeln("<br>");
       document.writeln(mangSo[2]);

       document.writeln("<br>");
       document.writeln(mangTen[1]);

       document.writeln("<br>");
       document.writeln(thongTin[2]);

       //Kiểm tra độ dài mảng length
       document.writeln("<br>");
       document.writeln(mangSo.length);

       //  gộp mảng concat
       var mang = mangSo.concat(mangTen, thongTin);
       document.writeln(mang);

       //Join
       document.writeln("<br>");
       document.writeln(mangSo.join("-"));

       //pop lấy ra số cuối cùng 
       document.writeln("<br>");
       document.writeln(mangSo.pop());

       //push lấy ra số cuối cùng 
       document.writeln("<br>");
       mangSo.push(6);
       document.writeln(mangSo);

       //reverse
       document.writeln("<br>");
       document.writeln(mangSo.reverse());

       //var soThuNhat = 10;
       //var soThuHai = 5;
       // == so sánh =
       // != so sánh khác
       // >
       //<
       // >=
       document.writeln("<br>");
       document.writeln(soThuNhat <= 14 );

       //var soThuNhat = 10;
       // var soThuHai = 5;
       var c = 10;
       var d = 5.5 ;
       // && || 
       // True & True = true
       // true & false = false
       // false & false
       document.write("<br>");
       document.writeln((soThuNhat > soThuHai) && ( c < d));

       //true || false =
       document.write("<br>");
       document.writeln((soThuNhat > soThuHai) || ( c < d)); 

       // var thu = homNay.getDay();
       document.write("<br>");
       document.writeln(thu);
       if (thu == 0) {
        document.writeln("Hôm nay là chủ nhật");
       }
       else{
        document.writeln(" Hôm nay không phải chủ nhật" +"<br>")  ;
       }
       
       // 0->4 F
       //4->5 D
       // 5->7 C
       // 7->8 B
       // 8-10 A+
       var diem= 5;

       if (diem < 4) {
        document.writeln(" Điểm F");
       }
       else if ( diem >=4 && diem < 5 ) {
        document.writeln(" Điểm D ");
       }
       else if ( diem >=5 && diem < 7 ) {
        document.writeln(" Điểm C ");
       }
       else if (diem >=7 && diem < 8 ) {
        document.writeln(" Điểm B ");
       }
       else if ( diem >=8 && diem <  10 ) {
        document.writeln(" Điểm A ");
       }
       else{ 
        document.writeln(" Điểm không hợp lệ");
       }
       // object: var name = { }
       var thongTinSinhVien ={
        hoTen :  " Ho Ngoc Ninh ",
        tuoi :21 ,
        gioiTinh : true, //true: Nam, fals: Nu
        diaChi: {
            thanhPho: " Ha Noi",
            phuong :" Dong Ngac ",
            duong :" Le Van Hien ",
        }
       }
       var thongTinPhim ={
        tenPhim :"Mua Do",
        daoDien: "Dang Thai Nguyen",
        nam : 2025,
        theLoai : "Lich Su",
        thoiLuong : 124,
        dienVien : {
            dienVienChinh: [
                "Do Nhat Hoang","Le Ha Anh", "Steven Nguyen"
            ],
            dienVienPhu : [
                "Do Nhat Hoang","Le Ha Anh", "Steven Nguyen"
            ],
        },
    
       }
       document.writeln("<br>")
       document.writeln(thongTinPhim.dienVien.dienVienChinh[2]);
       // switch case
       var d = new Date();
       var theDay = d.getDay();
       switch (theDay){
        case 5:
            document.writeln(" Finally Friday");
            break;
            case 5:
            document.writeln(" Super Satuday");
            break;
            case 5:
            document.writeln(" Sleep Sunday");
            break;
            default:
                document.writeln( "I'm looking forward to the weekend! ");

       }
       for( var index = 1; index <=10; index++){
           document.writeln("<br> Xin Chào !"+ index);
       }
       var danhSachSinhVien = [ "Nhung","Ninh", "Linh", "Tung","Am"];
       document.writeln("<br> Xin chào "+ danhSachSinhVien[0]);
       for (var i=0 ; i< danhSachSinhVien.length;i++){
        document.writeln("<br>" + i + "<br>");
        document.writeln( "Xin Chào" + danhSachSinhVien[i]);
       }
       var ds = [ "Nhung","Ninh", "Linh", "Tung","Am"];
       for (var i=0 ; i< ds.length;i++) {
        
        if (ds[i] == " Nhung"|| ds[i]== "Ninh") {
        document.writeln("<br>");
        document.writeln("Xin Chào" + ds[i]);
       }
    }
    // popup boxes 
    alert ( "Xin Chào!");

    // confirm
    var r = confirm("Press a button")
    if(r == true) {
        document.write("You  pressed OK!")
    }
    else{
        document.write("You pressed Cancel!")
    }

    // promt
    r = prompt("Nhập vào họ tên", " Nhập  tên vào đây!");
    document.write(r)


    


    
       
    

    
     </script>
